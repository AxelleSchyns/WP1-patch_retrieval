[project]
name = "wp1"
version = "0.1.0"
description = "WP1 Patch retrieval project"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "faiss-gpu-cu12",
    "numpy==1.26.4",
    "lightly==1.5.4",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "pillow==10.3.0",
    "pytorch-lightning>=2.0.0",
    "redis>=5.0.4",
    "scikit-image==0.22.0",
    "scikit-learn==1.5.0",
    "seaborn==0.13.2",
    "timm>=1.0.28",
    "torch==2.3.1+cu121",
    "torchvision==0.18.1+cu121",
    "tqdm>=4.66.4",
    "transformers>=4.41.0,<4.45.0",
    "ipykernel>=7.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
